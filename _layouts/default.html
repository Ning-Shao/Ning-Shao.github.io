<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header>
      <h1>{{ site.title }}</h1>
      <p>
        <span class="lang-en">{{ site.description }}</span>
        <span class="lang-zh">专注于教育、设计科技与以人为本 AI 工具的 AI 产品构建者。</span>
      </p>
    </header>

    <main>
      {{ content }}
    </main>
    
    <footer>
      <p>© 2025 Ning Shao | Designed with love </p>
    </footer>
    <script>
      (function () {
        const languageButtons = document.querySelectorAll('[data-set-lang]');
        const savedLanguage = localStorage.getItem('portfolioLanguage') || 'en';

        function setPortfolioLanguage(language) {
          document.body.classList.toggle('show-zh', language === 'zh');
          document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';

          languageButtons.forEach(button => {
            const isActive = button.dataset.setLang === language;
            button.classList.toggle('is-active', isActive);
            button.setAttribute('aria-pressed', String(isActive));
          });

          localStorage.setItem('portfolioLanguage', language);
        }

        languageButtons.forEach(button => {
          button.addEventListener('click', () => setPortfolioLanguage(button.dataset.setLang));
        });

        setPortfolioLanguage(savedLanguage);
      })();
    </script>
  </body>
</html>
